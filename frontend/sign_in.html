  <div class="main-container">
    <div class="glass-box">
      <h1>CREATE ACCOUNT</h1>
      
      <form class="create-account-form">
        <div class="input-group">
          <label for="username">USERNAME</label>
          <input type="text" id="username" name="username" required>
          <div class="error-message" id="username-error"></div>
        </div>

        <div class="input-group">
          <label for="email">EMAIL ID</label>
          <input type="email" id="email" name="email" required>
          <div class="error-message" id="email-error"></div>
        </div>

        <div class="input-group">
          <label for="phone">PHONE NO</label>
          <input type="tel" id="phone" name="phone" required>
          <div class="error-message" id="phone-error"></div>
        </div>

        <div class="input-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" required>
          <div class="error-message" id="password-error"></div>
        </div>

        <div class="input-group">
          <label for="confirm-password">CONFIRM PASSWORD</label>
          <input type="password" id="confirm-password" name="confirm-password" required>
          <div class="error-message" id="confirm-password-error"></div>
        </div>

        <button type="submit" class="create-account-btn">CREATE ACCOUNT</button>
        
        <div class="success-message" id="success-message">
          Account created successfully! 
        </div>
      </form>

          </div>
  </div>

  <script type="module">
    import { Auth } from './data.js';

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(error => {
        error.textContent = '';
        error.style.display = 'none';
      });
      const successElement = document.getElementById('success-message');
      successElement.classList.remove('show');
    }

    function showError(fieldId, message) {
      const errorElement = document.getElementById(fieldId + '-error');
      if (errorElement) {
        errorElement.textContent = message;
        errorElement.style.display = 'block';
      }
    }

    function showSuccess() {
      const successElement = document.getElementById('success-message');
      successElement.classList.add('show');
    }

    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function validatePhone(phone) {
      const phoneRegex = /^[0-9]{10}$/;
      return phoneRegex.test(phone.replace(/\D/g, ''));
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    document.querySelector('.create-account-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      clearErrors();
      
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      let isValid = true;
      
      if (username.length < 3) {
        showError('username', 'Username must be at least 3 characters long');
        isValid = false;
      }
      
      if (!validateEmail(email)) {
        showError('email', 'Please enter a valid email address');
        isValid = false;
      }
      
      if (!validatePhone(phone)) {
        showError('phone', 'Please enter a valid 10-digit phone number');
        isValid = false;
      }
      
      if (!validatePassword(password)) {
        showError('password', 'Password must be at least 6 characters long');
        isValid = false;
      }
      
      if (password !== confirmPassword) {
        showError('confirm-password', 'Passwords do not match');
        isValid = false;
      }
      
      if (isValid) {
        const btn = document.querySelector('.create-account-btn');
        const originalText = btn.textContent;
        btn.textContent = 'Creating...';
        btn.disabled = true;

        try {
          await Auth.register({ username, email, phone, password });
          showSuccess();
          setTimeout(() => {
            window.location.href = 'budget_overview.html';
          }, 1000);
        } catch (error) {
          showError('username', error.message || 'Registration failed');
        } finally {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }
    });

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', function() {
        const errorElement = document.getElementById(this.id + '-error');
        if (errorElement) {
          errorElement.style.display = 'none';
        }
      });
    });
  </script>
